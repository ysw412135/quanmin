<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>仲景方剂来源审计</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;margin:0;background:#f5f7f5;color:#1f2f24}.wrap{max-width:1050px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dce7de;border-radius:16px;padding:18px;margin:14px 0}h1{color:#14532d}.ok{color:#166534}.bad{color:#b91c1c}.warn{color:#92400e}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e7eee8;text-align:left;vertical-align:top}code{background:#edf4ee;padding:2px 5px;border-radius:5px}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#edf7ef;margin:2px;font-size:12px}</style>
</head>
<body><main class="wrap">
<h1>全民经方中医 · 仲景方剂来源审计</h1>
<p>内部开发工具。公开结果页中的具体经典方剂，来源仅允许《伤寒论》《金匮要略》。</p>
<div id="summary" class="card"></div>
<div class="card"><h2>需要人工复核</h2><table><thead><tr><th>位置</th><th>方证</th><th>状态</th><th>现有原典字段</th><th>其他敏感字段</th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<script src="./trees.js"></script>
<script>
(function(){
'use strict';
var allowed=['《伤寒论》','《金匮要略》'];
function status(node){var o=String(node.original||'');if(!o)return'missing';return allowed.some(function(x){return o.indexOf(x)>=0;})?'allowed':'other';}
function extras(node){var x=[];['otc','combo','formula','method','warning'].forEach(function(k){if(node&&node[k])x.push(k);});return x;}
var seen=new Set(),items=[];
function add(scope,key,node){if(!node||!node.syndrome)return;var id=scope+'::'+key+'::'+node.syndrome;if(seen.has(id))return;seen.add(id);items.push({scope:scope,key:key,node:node,status:status(node),extras:extras(node)});}
if(window.SHARED)Object.keys(window.SHARED).forEach(function(k){add('SHARED',k,window.SHARED[k]);});
if(window.TREES)Object.keys(window.TREES).forEach(function(treeId){var nodes=window.TREES[treeId]&&window.TREES[treeId].nodes||{};Object.keys(nodes).forEach(function(k){add(treeId,k,nodes[k]);});});
var allowedCount=items.filter(function(x){return x.status==='allowed';}).length;
var missing=items.filter(function(x){return x.status==='missing';});
var other=items.filter(function(x){return x.status==='other';});
var withExtras=items.filter(function(x){return x.extras.length;});
document.getElementById('summary').innerHTML='<div><span class="pill">方证节点 '+items.length+'</span><span class="pill ok">两书出处已标注 '+allowedCount+'</span><span class="pill warn">缺原典字段 '+missing.length+'</span><span class="pill bad">其他出处 '+other.length+'</span><span class="pill">含 formula/method/otc 等字段 '+withExtras.length+'</span></div><p>上线规则：<b>missing/other 节点不得被描述为“已核实的仲景经典方”。</b>敏感字段即使存在于历史数据中，也应与公开结果展示解耦并逐步清理。</p>';
var review=missing.concat(other).sort(function(a,b){return a.status.localeCompare(b.status)||a.scope.localeCompare(b.scope);});
document.getElementById('rows').innerHTML=review.map(function(x){var cls=x.status==='other'?'bad':'warn';var label=x.status==='other'?'出处不属于允许列表':'缺少原典字段';return '<tr><td><code>'+escapeHtml(x.scope+'/'+x.key)+'</code></td><td>'+escapeHtml(x.node.syndrome)+'</td><td class="'+cls+'">'+label+'</td><td>'+escapeHtml(x.node.original||'—')+'</td><td>'+escapeHtml(x.extras.join(', ')||'—')+'</td></tr>';}).join('')||'<tr><td colspan="5" class="ok">未发现需要人工复核的节点。</td></tr>';
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
})();
</script></body></html>
